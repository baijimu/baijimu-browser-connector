[package]
name = "baijimu-browser-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Baijimu local browser connector with workspace-scoped persistent profiles."

[[bin]]
name = "baijimu-browser-connector"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
headless_chrome = { version = "1.0.22", default-features = false, features = ["offline", "rustls-tls-webpki-roots"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

